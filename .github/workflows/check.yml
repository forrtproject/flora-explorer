name: Validate explorer
on:
  pull_request:
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'index.html', 'vite.config.js', 'package*.json', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Use the Chrome preinstalled on GitHub's Ubuntu runners: installing Playwright's
      # Chromium with --with-deps needs the Ubuntu package mirror, which can be unreachable.
      - run: google-chrome --version
      - run: npm test
        env:
          BROWSER_CHANNEL: chrome
