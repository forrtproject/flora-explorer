name: Deploy explorer to staging

# Publishes a build to https://staging.forrt.org/flora-explorer/. Three ways to deploy:
#   - Push to the `staging` branch, or to any `staging/<name>` branch.
#   - Push a tag starting with `staging`, e.g. `staging-2026-11-18`.
#   - Actions -> "Deploy explorer to staging" -> Run workflow, and enter any branch, tag or
#     commit (leave empty to deploy the branch picked in the dropdown).
# The latest deploy wins: staging shows one build of the explorer at a time.
#
# The FORRT website serves staging from the `staging` branch of forrtproject/webpage-staging.
# This workflow only replaces the flora-explorer/ folder there. The `.staging-subsite` marker
# tells the website's own staging deploy to keep the folder when it rebuilds the branch.
on:
  push:
    branches: ['staging', 'staging/**']
    tags: ['staging*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to deploy (empty = the branch selected above)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: staging-flora-explorer
  cancel-in-progress: true

env:
  STAGING_REPO: forrtproject/webpage-staging
  STAGING_BRANCH: staging
  SLUG: flora-explorer

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.forrt.org/flora-explorer/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Describe source
        id: source
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check out staging site
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STAGING_REPO }}
          ref: ${{ env.STAGING_BRANCH }}
          token: ${{ secrets.STAGING_GITHUB_TOKEN }}
          path: staging-site

      - name: Publish to staging
        working-directory: staging-site
        env:
          REF: ${{ steps.source.outputs.ref }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          rm -rf "$SLUG"
          cp -r ../dist "$SLUG"
          touch "$SLUG/.staging-subsite"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$SLUG"
          if git diff --cached --quiet; then
            echo "Staging already matches $REF ($SHA)."
            exit 0
          fi
          git commit -m "Deploy $SLUG $REF ($SHA)"
          # Other apps deploy to the same branch. They only touch their own folders,
          # so a rejected push is fixed by rebasing onto theirs and trying again.
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$STAGING_BRANCH" && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest staging."
            sleep $((attempt * 3))
            git pull --rebase origin "$STAGING_BRANCH"
          done
          echo "Could not push to $STAGING_BRANCH after 5 attempts."
          exit 1

      - name: Summary
        env:
          REF: ${{ steps.source.outputs.ref }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "Deployed \`$REF\` (\`$SHA\`) to https://staging.forrt.org/$SLUG/" >> "$GITHUB_STEP_SUMMARY"
